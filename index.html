<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>UniMart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

    <!-- =================================
         TOP STATUS BAR
    ================================== -->

    <div class="status-bar">

        <span class="time">9:41</span>

        <div class="status-icons">
            <span class="signal">•••</span>
            <span class="wifi">⌁</span>
            <span class="battery">▭</span>
        </div>

    </div>


    <!-- =================================
         TOP BACKGROUND
    ================================== -->

    <div class="top-peach"></div>

    <div class="top-green"></div>


    <!-- =================================
         NOTCH
    ================================== -->

    <div class="notch"></div>


    <!-- =================================
         MAIN CONTENT
    ================================== -->

    <main class="welcome">


        <!-- STORE LOGO -->

        <div class="store-logo">

            <div class="roof">

                <div class="roof-piece yellow"></div>
                <div class="roof-piece orange"></div>
                <div class="roof-piece yellow"></div>
                <div class="roof-piece orange"></div>
                <div class="roof-piece yellow"></div>

            </div>

            <div class="store-body">

                <div class="cart-icon">

                    <div class="cart-basket">
                        🛒
                    </div>

                </div>

            </div>

        </div>


        <!-- =================================
             BRAND
        ================================== -->

        <div class="brand">

            <span class="uni">Uni</span>
            <span class="mart">Mart</span>

        </div>


        <!-- =================================
             TAGLINE
        ================================== -->

        <div class="tagline">

            <div>Maliit na Tindahan,</div>

            <div>Malaking Solusyon!</div>

        </div>


        <!-- =================================
             BUTTONS
        ================================== -->

        <div class="actions">

            <button
                id="getStarted"
                class="get-started"
            >
                Get Started
            </button>


            <button
                id="loginBtn"
                class="login-button"
            >
                I already have an account
            </button>

        </div>


    </main>


    <!-- =================================
         BOTTOM DESIGN
    ================================== -->

    <div class="bottom-yellow"></div>

    <div class="bottom-peach"></div>

    <div class="bottom-green"></div>

</div>


<script src="script.js"></script>

</body>
</html>s
